<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Image Gallery</title>
    <style media="screen">
        div.box {
            width: 200px;
            float: left;
            margin: 10px;
            display: inline-block;
            border: 2px solid #ddd;
        }
        div.box img {
            width: 100%;
            height: 250px;
        }
        div.box:hover {
            border: 3px solid #000;
        }
        div.box div.deskripsi {
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="images/soeharto.jpg">
        <div class="deskripsi">Soeharto</div>
    </div>
    <div class="box">
        <img src="images/habibi.jpg">
        <div class="deskripsi">Baharuddin Jusuf Habibi</div>
    </div>
    <div class="box">
        <img src="images/gusdur.jpg">
        <div class="deskripsi">KH. Abdurrahman Wahid</div>
    </div>
    <div class="box">
        <img src="images/sby.jpg">
        <div class="deskripsi">Susilo Bambang Yudhoyono</div>
    </div>
    <div class="box">
        <img src="images/jokowi.jpg">
        <div class="deskripsi">Ir. H. Joko Widodo</div>
    </div>
</body>
</html>
